spring.application.name=TechShop

# efine el puerto donde se escuchara el servidor
server.port=80

# Definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

# Eliminar mensajes invasivos de spring
spring.main.banner-mode=off

# Cache del servidor: false en durante el desarrollo, true en produccion
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuario_Clave.

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE