<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <!-- fragmento 1 para Agregar producto en ventana modal -->
        <section th:fragment="tabs" class="py-3 mb-4">
            <div class="d-flex justify-content-center px-5">
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a th:href="@{/}"
                           th:classappend="${idCategoriaActual == null} ? 'active'"
                           class="nav-link"
                           aria-current="page">
                            [[#{pruebas.todas}]]
                        </a>
                    </li>
                    <li th:each="c : ${categorias}" class="nav-item">
                        <a th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                           th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                           class="nav-link">
                            [[${c.descripcion}]]
                        </a>
                    </li>
                </ul>
            </div>
        </section>
        <!-- fragmento 2 para el listado de tarjetas productos -->
        <section th:fragment="tarjetas" class="container py-4">
            <div class="row row-cols-1 row-cols-md-3 row-cols-xl-4 g-4">
                <div class="col" th:each="p : ${productos}">
                    <div class="card h-100 shadow-sm text-center">
                        <img th:src="@{${p.rutaImagen}}" 
                             class="card-img-top img-fluid mx-auto d-block p-3" 
                             style="height:200px; object-fit:contain;" 
                             alt="Imagen producto"/>
                        <div class="card-body">
                            <h6 class="card-title text-truncate fw-bold" th:text="${p.descripcion}"></h6>
                            <p class="card-text text-muted text-truncate" th:text="${p.detalle}"></p>
                        </div>
                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <span class="text-success fw-semibold" th:text="${#numbers.formatCurrency(p.precio)}"></span>
                            <span class="badge bg-success rounded-pill" th:text="${p.existencias} + ' unidades'"></span>
                            <form th:action="@{/carrito/agregar}" th:method="POST" class="m-0">
                                <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                                <button type="submit" class="btn btn-primary btn-sm" th:disabled="${p.existencias == 0}">
                                    <i class="bi bi-cart text-white"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section th:fragment="consultas" class="row row-cols-4 p-2">
            <div th:replace="~{consultas/fragmentos :: formConsulta('primary',#{consultas.derivadas},'/consultas/consultaDerivada')}"/>
            <div th:replace="~{consultas/fragmentos :: formConsulta('warning',#{consultas.jpql},'/consultas/consultaJPQL')}"/>
            <div th:replace="~{consultas/fragmentos :: formConsulta('success',#{consultas.sql},'/consultas/consultaSQL')}"/>
            <div class="card"><p>Acá va su Práctica #2</p></div>
        </section>
        <div th:fragment="formConsulta(colorForm, textoForm, urlForm)">
            <form method="post" th:action="@{${urlForm}}" class="was-validated">
                <div class="card p-2">
                    <div class="card-header text-center text-white" th:classappend="${'bg-'+colorForm}">
                        <h5>[[${textoForm}]]</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label>[[#{consultas.precio.inferior}]]</label>
                            <input type="number" name="precioInf" th:value="${precioInf}"
                                   class="form-control" min="0" required/>
                        </div>
                        <div class="mb-3">
                            <label>[[#{consultas.precio.superior}]]</label>
                            <input type="number" name="precioSup" th:value="${precioSup}"
                                   class="form-control" min="0" required/>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button type="submit" class="btn text-white" th:classappend="${'btn-'+colorForm}">
                            <i class="fa-solid fa-magnifying-glass"></i> [[${textoForm}]]
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
